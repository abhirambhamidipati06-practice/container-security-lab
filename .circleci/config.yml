version: 2.1

jobs:
  build-and-scan:
    docker:
      - image: cimg/base:2024.01
    steps:
      - checkout

      - setup_remote_docker:
          docker_layer_caching: false

      - run:
          name: Build Docker image
          command: docker build -t container-security-lab:$CIRCLE_SHA1 .

      - run:
          name: Install Trivy
          command: |
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https gnupg lsb-release
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
            sudo apt-get update
            sudo apt-get install -y trivy

      - run:
          name: Scan image with Trivy (report all)
          command: trivy image --severity CRITICAL,HIGH,MEDIUM --exit-code 0 container-security-lab:$CIRCLE_SHA1

      - run:
          name: Scan image with Trivy (fail on CRITICAL)
          command: trivy image --severity CRITICAL --exit-code 1 container-security-lab:$CIRCLE_SHA1

workflows:
  build-scan-workflow:
    jobs:
      - build-and-scan
