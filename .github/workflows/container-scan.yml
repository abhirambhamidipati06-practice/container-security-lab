name: Container Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t container-security-lab:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (report all)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "container-security-lab:${{ github.sha }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Run Trivy vulnerability scanner (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "container-security-lab:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
